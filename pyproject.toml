[project]
name = "AI-Research-Assistant"
version = "0.2.0"
description = "LLM Inference API with vLLM and async Redis queue"
authors = [
    {name = "Prasad-178", email = "prasadjs178@gmail.com"},
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]
requires-python = "==3.10.*"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
# Worker dependencies (GPU instance only)
worker = [
    "vllm>=0.4.0",
    "torch>=2.1.0",
]

[tool.pdm]
distribution = false
