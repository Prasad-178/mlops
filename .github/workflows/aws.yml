name: Deploy to AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}
  ECR_PUBLIC_ALIAS: ${{ secrets.ECR_PUBLIC_REGISTRY_ALIAS }}

jobs:
  build-and-push-api:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Initial free space:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          echo "Free space after cleanup:"
          df -h

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_PUBLIC_ALIAS }}/${{ env.ECR_REPOSITORY_NAME }}:api-latest
            ${{ env.ECR_PUBLIC_ALIAS }}/${{ env.ECR_REPOSITORY_NAME }}:api-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-worker:
    name: Build and Push Worker Image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Worker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_PUBLIC_ALIAS }}/${{ env.ECR_REPOSITORY_NAME }}:worker-latest
            ${{ env.ECR_PUBLIC_ALIAS }}/${{ env.ECR_REPOSITORY_NAME }}:worker-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-infrastructure:
    name: Deploy Infrastructure with Terraform
    needs: [build-and-push-api, build-and-push-worker]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=./terraform init

      - name: Terraform Validate
        run: terraform -chdir=./terraform validate

      - name: Terraform Apply
        run: |
          API_IMAGE="${{ env.ECR_PUBLIC_ALIAS }}/${{ env.ECR_REPOSITORY_NAME }}:api-${{ github.sha }}"
          WORKER_IMAGE="${{ env.ECR_PUBLIC_ALIAS }}/${{ env.ECR_REPOSITORY_NAME }}:worker-${{ github.sha }}"
          
          terraform -chdir=./terraform apply -auto-approve \
            -var="api_image_uri=${API_IMAGE}" \
            -var="worker_image_uri=${WORKER_IMAGE}" \
            -var="deploy_gpu_worker=${{ secrets.DEPLOY_GPU_WORKER || 'false' }}"
